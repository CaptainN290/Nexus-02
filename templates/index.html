<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>𝐍𝐞𝐱𝐮𝐬 𝐁𝐨𝐭 Dashboard</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #0e1117;
            color: #e4e6eb;
            text-align: center;
            margin: 0;
            padding: 0;
        }
        h1 {
            font-size: 2.5em;
            margin-top: 30px;
            color: #7289da;
        }
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            max-width: 800px;
            margin: 40px auto;
        }
        .card {
            background: #1c1f26;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 0 10px #0003;
        }
        button {
            background: #7289da;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            margin: 10px;
            transition: 0.2s;
        }
        button:hover {
            background: #5b6ea5;
        }
        .footer {
            margin-top: 40px;
            color: #aaa;
        }
    </style>
</head>
<body>
    <h1>𝐍𝐞𝐱𝐮𝐬 𝐁𝐨𝐭 Dashboard</h1>
    <div class="stats" id="stats"></div>

    <div>
        <button onclick="window.location.href='/commands'">View Commands</button>
        <button onclick="window.open('https://discord.com/oauth2/authorize?client_id=YOUR_CLIENT_ID&permissions=8&scope=bot%20applications.commands', '_blank')">Invite Bot</button>
    </div>

    <div class="footer">Made by @CaptainN29</div>

    <script>
        async function loadStats() {
            try {
                const res = await fetch('/api/stats');
                const data = await res.json();
                const stats = document.getElementById('stats');
                stats.innerHTML = `
                    <div class="card"><h3>Ping</h3><p>${data.ping}</p></div>
                    <div class="card"><h3>Uptime</h3><p>${data.uptime}</p></div>
                    <div class="card"><h3>Servers</h3><p>${data.servers}</p></div>
                    <div class="card"><h3>Users</h3><p>${data.users}</p></div>
                    <div class="card"><h3>CPU Usage</h3><p>${data.cpu}%</p></div>
                    <div class="card"><h3>Memory Usage</h3><p>${data.memory}%</p></div>
                    <div class="card"><h3>OS</h3><p>${data.os}</p></div>
                `;
            } catch (err) {
                console.error(err);
            }
        }
        loadStats();
        setInterval(loadStats, 5000); // refresh every 5s
    </script>
</body>
</html>

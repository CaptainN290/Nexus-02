<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Bot</title>

    <!-- Lexend font -->
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Lexend', sans-serif;
            background-color: #000;
            color: #FFD700; /* gold */
            margin: 0;
            padding: 0;
            text-align: center;
        }

        .container {
            max-width: 900px;
            margin: auto;
            padding: 40px;
        }

        h1 {
            font-size: 48px;
            margin-bottom: 10px;
            color: #FFD700;
        }

        p {
            font-size: 20px;
        }

        .button {
            display: inline-block;
            margin-top: 25px;
            padding: 14px 28px;
            background-color: #FFD700;
            color: #000;
            font-weight: bold;
            border-radius: 8px;
            text-decoration: none;
            transition: 0.3s;
        }

        .button:hover {
            background-color: #e6c200;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>𝐍𝐞𝐱𝐮𝐬 𝐁𝐨𝐭</h1>
        <p>The next-generation multitool Discord bot.</p>

        <a href="/commands" class="button">View Commands</a>
        <br><br>
        <a href="https://discord.com/oauth2/authorize?client_id=1432139270860177581&permissions=8&integration_type=0&scope=bot"
           class="button">Invite Nexus</a>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Nexus Dashboard</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="/static/dashboard.js" defer></script>
</head>

<body>

<nav class="navbar">
    <h1 class="logo glow-gold">NEXUS BOT</h1>
    <ul>
        <li><a href="/">Home</a></li>
        <li><a href="/commands">Commands</a></li>
        <li><a href="/dashboard">Dashboard</a></li>
    </ul>
</nav>

<div class="container">

    <h2 class="glow-gold big-title">Dashboard</h2>

    <!-- BOT STATS -->
    <div id="dashboard-stats" class="dashboard-card">
        <h3 class="glow-gold">Live Bot Stats</h3>
        <p>Loading bot statistics...</p>
    </div>

    <!-- GUILD SELECTOR -->
    <div class="dashboard-card">
        <h3 class="glow-gold">Select a Server</h3>
        <select id="guild-select" class="guild-dropdown">
            <option>Loading servers...</option>
        </select>
    </div>

    <!-- GUILD INFO -->
    <div id="guild-info-box" class="dashboard-card">
        <h3 class="glow-gold">Server Details</h3>
        <p>Select a server to view info.</p>
    </div>

    <!-- CONTROL PANEL -->
    <div id="control-panel" class="dashboard-card">
        <h3 class="glow-gold">Bot Controls</h3>

        <button class="dash-btn" onclick="sendBotCommand('restart')">Restart Bot</button>
        <button class="dash-btn" onclick="sendBotCommand('sync')">Sync Commands</button>
        <button class="dash-btn" onclick="sendBotCommand('status')">Refresh Status</button>
    </div>

</div>

</body>
</html>

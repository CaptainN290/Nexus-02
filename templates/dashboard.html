<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Nexus Dashboard</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="/static/dashboard.js" defer></script>
</head>

<body>

<nav class="navbar">
    <h1 class="logo glow-gold">𝐍𝐄𝐗𝐔𝐒 𝐁𝐎𝐓</h1>
    <ul>
        <li><a href="/">Home</a></li>
        <li><a href="/commands">Commands</a></li>
        <li><a href="/dashboard">Dashboard</a></li>
    </ul>
</nav>

<div class="container">

    <h2 class="glow-gold big-title">Dashboard</h2>

    <!-- BOT STATS -->
    <div id="dashboard-stats" class="dashboard-card glass">
        <p>Loading bot statistics...</p>
    </div>

    <!-- GUILD SELECTOR -->
    <div class="dashboard-card glass">
        <h3 class="gold-animate">Select a Server</h3>
        <select id="guild-select" class="guild-dropdown"></select>
    </div>

    <!-- GUILD INFO -->
    <div id="guild-info-box" class="dashboard-card glass">
        <p class="gold-animate">Select a server to view details.</p>
    </div>

    <!-- MEMBERS -->
    <div id="guild-members-box" class="dashboard-card glass">
        <h3 class="gold-animate">Members</h3>
        <p>Loading...</p>
    </div>

    <!-- ROLES -->
    <div id="guild-role-box" class="dashboard-card glass">
        <h3 class="gold-animate">Role Manager</h3>
        <p>Select a member to manage roles.</p>

        <select id="role-member-select"></select>
        <div id="role-list"></div>
    </div>

    <!-- CONTROL PANEL -->
    <div id="control-panel" class="dashboard-card glass">
        <h3 class="gold-animate">Bot Controls</h3>

        <button class="dash-btn" onclick="sendBotCommand('restart')">Restart Bot</button>
        <button class="dash-btn" onclick="sendBotCommand('sync')">Sync Commands</button>
        <button class="dash-btn" onclick="sendBotCommand('status')">Refresh Status</button>
    </div>

</div>

</body>
</html>
